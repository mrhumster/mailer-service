apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailer-service
  namespace: go-app
  labels:
    app: mailer-service
spec:
  selector:
    matchLabels:
      app: mailer-service
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: mailer-service
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
      labels:
        app: mailer-service
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: mailer-service
          image: xomrkob/mailer-service:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: mailer-service-config
            - secretRef:
                name: casbin-redis
            - secretRef:
                name: smtp-credentials
      restartPolicy: Always